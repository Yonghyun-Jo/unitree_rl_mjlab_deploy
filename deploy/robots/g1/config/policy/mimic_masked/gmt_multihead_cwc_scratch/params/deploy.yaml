# mjlab_g1_motion — masked-3mode flow student + foot_z (stage2_masked, masked_footz_v0), G1 29-DOF.
# Source checkpoint: logs/rsl_rl/g1_student/2026-06-23_16-44-46_masked_footz_v0/model_29999.pt
# Policy ONNX: obs[1,1640] -> actions[1,29].  obs = 10 terms (164D single frame) x history 10.
# WOSE branch: masked_root_pos_b(3) DROPPED (privileged true pelvis pos, unobservable on real G1).
#   164D yaml + exported/policy.onnx = wose 1640D multihead (flow_44000 + mode1_20000/mode2_18500/
#   mode3_19500, parity 2.5e-6, 2026-07-10). sim2sim ready — no C++ rebuild needed (obs data-driven).
#
# ⚠ HISTORY LAYOUT = TERM-MAJOR (must match mjlab ObservationManager):
#   each term keeps its own history(10), flattened oldest->newest, then terms concatenated:
#   [base_ang_vel x10 | projected_gravity x10 | command x10 | ... | command_mask x10 | ref_foot_height x10] = 1640.
#   The C++ ObservationManager produces this when `use_gym_history` is unset/false (default).
#   DO NOT set use_gym_history: true (that gives frame-major -> wrong order).
#
# ⚠ 5 obs terms below need C++ REGISTER_OBSERVATION (not in upstream): masked_joint_command,
#   masked_root_ori_b, base_vel_command, command_mask, ref_foot_height.
#   (wose: masked_root_pos_b dropped from the actor — its REGISTER_OBSERVATION may stay unused in C++.)
#   base_vel_command + ref_foot_height are produced by MaskedLocoController (State_Mimic.cpp).
#   The other 5 (base_ang_vel, projected_gravity, joint_pos_rel, joint_vel_rel, last_action)
#   already exist in deploy/include/isaaclab/envs/mdp/observations/observations.h.

