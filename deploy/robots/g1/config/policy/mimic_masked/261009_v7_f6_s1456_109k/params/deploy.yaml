#   manifest   motions/g1_flow_specialists_c3_m6.yaml   (export 워크트리 /home/piene/mjlab1.4/mjlab_g1_final)
#   mode1 head 2026-10-27_18-37-42_s4_mode1_m3all250k_resume89k_to109k/keep_108998.pt  (launch commit 640aae0)
#   mode4 head 2026-10-26_12-11-17_s4_mode4_m3all250k_resume227k_to250k/keep_249995.pt  (launch commit 77b6aa0)
#   mode5 head 2026-10-26_01-05-42_s4_mode5_m3all250k_rebase115k_to140k_retry/keep_130000.pt  (launch commit ?)
#   mode6 head 2026-10-20_12-43-44_s4_mode6_v6final_rebase90k_to110k/rebase_m3all250k_109996.pt  (launch commit ?)
#   sampling_steps=6 · 내놓는 모드 [1, 4, 5] (ONNX 에 든 다른 모드 head 는 이 슬롯이 거부한다)
# Policy ONNX: obs[1,3006] -> actions[1,29]. observations: 블록은 gen_obs_block.py 출력 그대로(ONNX 계약이 원장).
#
# ⚠ HISTORY LAYOUT = TERM-MAJOR (mjlab ObservationManager 와 같다). use_gym_history: true 금지.

# ── 이 슬롯이 요구하는 C++ 기능 (DeployFeatures.h) ───────────────────────────────
# 🔴 yaml 파서는 «모르는 키를 그냥 지나친다». 그래서 아래 gait: 의 table/cadence/turn_asym 을
#    모르는 바이너리로 이 슬롯을 돌리면 **에러 없이 옛 거동**(V1 표·cadence 1.0)이 나온다.
#    이 선언이 그걸 기동 시점에 막는다 — 모르는 기능이 하나라도 있으면 exit(1) + 재빌드 안내.
#    새 키/블록으로 «거동» 을 바꾸면 여기에 기능 이름을 추가할 것.
requires:
  - obs_contract        # 기동 시 ONNX 메타데이터의 obs 계약을 deploy.yaml 과 대조
  - gait_mode_table     # gait: 의 모드별 table(V1/V2) · cadence · turn_asym
  - ref_foot_height_ref # 클립 재생 모드의 발-z 를 레퍼런스(클립/VR)에서 얻는다
  - gait_settle         # 🔴 gait: mode1 줄이 settle_steps 를 쓴다 — 없는 바이너리는 조용히 무시한다
  - gait_min_swing      # 🔴 저속 스윙 최소 클리어런스. 모르는 바이너리는 조용히 무시하고 낮게 든다
  - safety_per_joint    # 🔴 vel_max/qd_crit 가 관절별 리스트. 옛 바이너리는 못 읽고 안전층을 조용히 끈다
  - mode_table          # 🔴 modes: 선언. 옛 바이너리는 modes: 를 조용히 무시하고 1~4 를 전부 받아 준다
  - obs_contract_v2     # 🔴 관측 항 mode_mask · mode5_command · motion_preview_on/k1/preview
  - mode5_driver        # 🔴 mode5 자세 버튼(Mode5Driver) + 골반 높이 추정(z_fk) + 이탈 조건에 실측 자세
  - ground_safety       # 🔴 넘어짐·qd_warn 을 표의 안전 등급으로 (mode4·5 = GroundCapable)
  - limb_z_obs        # 🔴 관측 항 ref_limb_height(4) — v6final 이후 base 의 계약
  - clip_list         # 🔴 clips: 목록. 옛 바이너리는 조용히 무시하고 config.yaml 의 클립만 보인다

# 이 슬롯(ONNX)이 아는 모드. 1 = base 만(폴백 — qd 안전 래치를 풀 모드라 빠지면 기동 거부),
# 4 = 클립 재생 헤드, 5 = 저자세 자세 헤드. 2·3 은 ONNX 안에 base 로 있지만 이 슬롯은 내놓지 않는다.
