    offset: [-0.312, 0.0, 0.0, 0.669, -0.363, 0.0, -0.312, 0.0, 0.0, 0.669, -0.363, 0.0,
             0.0, 0.0, 0.0,
             0.2, 0.2, 0.0, 0.6, 0.0, 0.0, 0.0, 0.2, -0.2, 0.0, 0.6, 0.0, 0.0, 0.0]
    joint_ids: null

# ── observations: EXACT order + dims must match StudentPolicyCfg (164D single frame; wose) ──
# all history_length: 10, all scale 1.0 (policy group has no per-term scale in training).
