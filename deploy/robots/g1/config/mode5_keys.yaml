# mode5 자세 버튼의 «배포 사실» — 어느 키가 어느 자세인가, mode5 에 들어갈 때 어느 자세로 시작하나.
# 자세의 값(접촉·중력·높이·가는 중 z_mask)은 학습 원장 mjlab_g1_motion/mode5_presets.py 가 갖는다.
# 여기엔 «이름» 만 쓴다 — 이름이 원장에 없으면 생성기가 실패한다(오타가 조용히 안 지나간다).
# 키는 modes.yaml 의 모드 키·조작 키(w a s d q e 공백 p v f m [ ])와 겹치면 생성기가 실패한다.
enter_preset: "직립"
keys:
  "직립": "z"
  "네발 기기": "x"
  "낮은 포복": "c"
  "바닥 앉기": "b"
  "드러누움": "n"
  "크랩(배위)": "h"
